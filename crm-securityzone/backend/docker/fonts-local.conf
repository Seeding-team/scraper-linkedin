<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- LibreOffice xuất PDF hợp đồng: "Times New Roman" không có trên Linux nên luôn bị thay bằng "Liberation Serif"
       (metric tương thích), nhưng font này THIẾU 1 số dấu tiếng Việt (ố, ộ, ầ, Ộ, Ủ, Ụ, Ợ...) nên fontconfig tự
       nhảy sang "DejaVu Serif" cho đúng những ký tự đó - khác hẳn độ đậm/kích thước với chữ xung quanh, nhìn như
       "đậm/to ngay chỗ có dấu" (bug đã báo). "FreeSerif" (có sẵn trong image, đi kèm libreoffice-writer) có đủ
       glyph tiếng Việt và cùng kiểu chữ serif cổ điển gần Times New Roman hơn DejaVu Serif - ưu tiên nó TRƯỚC
       DejaVu Serif trong danh sách font thay thế cho Liberation Serif/Times New Roman. -->
  <match target="pattern">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>FreeSerif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="append" binding="strong"><string>FreeSerif</string></edit>
  </match>
</fontconfig>
