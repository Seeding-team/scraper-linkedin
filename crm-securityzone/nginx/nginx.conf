worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    # ===== MSC (Mua Sắm Công): KHÔNG XOÁ / KHÔNG COPY ĐÈ KHI PORT TỪ MAIN — xem nginx/MSC_INTEGRATION.md =====
    upstream msc_prod_front { server 10.30.195.28:3000; }
    upstream msc_dev_front  { server 10.30.195.29:3000; }

    server {
        listen 8080;

        # SSE (Zalo realtime, đồng bộ từ crm-module 2026-09-23) - KHÔNG buffering,
        # timeout dài. Phải đặt TRƯỚC location /api/ ở dưới.
        location ~ ^/api/all-platform/zalo/events {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # CRM backend (FastAPI) + Zalo (request/response thường, trừ SSE ở trên)
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        # ===== MSC (Mua Sắm Công): KHÔNG XOÁ / KHÔNG COPY ĐÈ KHI PORT TỪ MAIN — xem nginx/MSC_INTEGRATION.md =====
        # Giao diện MSC dưới /msc (MSC chính) và /msc-dev (MSC dev), chuyển tiếp sang 2 máy MSC. Không đụng đường dẫn CRM gốc.
        # Xin "/" (không xin "/index.html"): máy MSC dùng `serve`, tự chuyển /index.html sang /index (301) làm trình duyệt rơi khỏi /msc.
location ^~ /assets/ {
            proxy_pass http://msc_prod_front;
            proxy_set_header Host $host;
        }
        location ^~ /assets-dev/ {
            proxy_pass http://msc_dev_front;
            proxy_set_header Host $host;
        }

        location ~ ^/msc/all-platform/(crm/leads|crm/customers|crm/customers/[^/]+|crm|quote-center|quote-history|contracts|contracts/[^/]+|quote-settings|quotes|quotes/new|quotes/[^/]+|crm/categories|crm/lead-rules|crm/interest-levels|crm/deal-stages|profile|quotes/[^/]+/edit|quotes/[^/]+/preview|crm/quotes/[^/]+|crm/progress|crm/analytics|crm/my-dashboard|crm/sale-teams|contract-templates|issuer-companies|sales-assets|service-catalog|service-catalog/config|service-catalog/price-book-zone|service-catalog/groups/[^/]+|admin/quan-ly-thanh-vien|inbox|tai-khoan|zalo-inbox|telegram-chat|telegram-chat/[^/]+)/?$ {
            rewrite ^ / break;
            proxy_pass http://msc_prod_front;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache";
        }

        location ~ ^/msc-dev/all-platform/(crm/leads|crm/customers|crm/customers/[^/]+|crm|quote-center|quote-history|contracts|contracts/[^/]+|quote-settings|quotes|quotes/new|quotes/[^/]+|crm/categories|crm/lead-rules|crm/interest-levels|crm/deal-stages|profile|quotes/[^/]+/edit|quotes/[^/]+/preview|crm/quotes/[^/]+|crm/progress|crm/analytics|crm/my-dashboard|crm/sale-teams|contract-templates|issuer-companies|sales-assets|service-catalog|service-catalog/config|service-catalog/price-book-zone|service-catalog/groups/[^/]+|admin/quan-ly-thanh-vien|inbox|tai-khoan|zalo-inbox|telegram-chat|telegram-chat/[^/]+)/?$ {
            rewrite ^ / break;
            proxy_pass http://msc_dev_front;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache";
        }
        # ===== hết phần MSC =====

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
