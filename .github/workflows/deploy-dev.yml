name: Deploy Dev

# Auto-deploy khi push/merge len dev (chay tren self-hosted runner tren host
# DEV). Nhan nut "Run workflow" neu muon deploy mot nhanh/commit cu the.
# KHONG dung actions/checkout vi day la "pull + rebuild" tren may that,
# khong phai build tu checkout moi.
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhanh/commit muon deploy (de trong = dung dev moi nhat)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull code theo ref duoc chon
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          echo "===== Sync code on DEV host ====="
          git checkout -- . || true
          git fetch origin "$REF" || git fetch origin || true
          git checkout -f "$REF" || git checkout -B "$REF" "origin/$REF" || true
          git reset --hard "origin/$REF" || true
          git clean -fd -e ".env*" -e "docker-compose*.yml" || true
          echo "===== Current commit on host ====="
          git log -n 1 --oneline

      # Xem giai thich chi tiet trong deploy-app.yml: build frontend chi thay
      # context ./linkedin-crawler-ui nen khong tu build lai duoc zip tu
      # ../extensions/ ben trong Docker -> phai dong goi rieng tren host truoc.
      - name: Dong goi lai extension zip tu source moi nhat
        run: |
          rm -rf linkedin-crawler-ui/node_modules || true
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo/linkedin-crawler-ui \
            node:20-alpine \
            sh -c "npm install --no-package-lock --no-save --no-audit archiver@^8.0.0 && npm run build:extensions && rm -rf node_modules" || true

      - name: Build frontend + backend
        run: docker compose build frontend backend

      - name: Ap dung migration database 221
        run: |
          docker run --rm -v "$PWD:/repo" postgres:alpine sh -c "psql 'postgresql://postgres.seeding:9Esqznvy_NTKeAFZDwrGh4FICe6Gr08XYBwA5kHzxuY@10.30.194.82:5432/postgres' -f /repo/linkedin_group_crawler/supabase/migrations/221_facebook_messenger_api.sql || true"

      - name: Ap dung container moi
        run: |
          docker compose up -d frontend backend
          sleep 5
          docker compose restart router
          docker image prune -f

      - name: Kiem tra healthcheck
        run: |
          sleep 3
          curl -sf -o /dev/null http://localhost:8080/ || (echo "Frontend khong phan hoi" && exit 1)
          curl -sf -o /dev/null http://localhost:8080/api/all-platform/auth/me || echo "Luu y: auth/me khong phai 200 (co the do chua dang nhap, khong tinh la loi)"

      # dev.seeding.markeeai.com duoc phuc vu boi 2 container rieng (frontend-dev/
      # backend-dev, docker-compose.dev.yml) - stack default o tren KHONG dung cho
      # domain. Buoc nay chan doan topology + rebuild 2 container -dev de code moi
      # thuc su len domain. Tat ca guard bang '|| true' de khong lam do workflow.
      #
      # QUAN TRONG: KHONG duoc truyen '-p seeding-dev' (hay bat ky '-p' nao khac
      # voi ten thu muc). Tren host nay, frontend-dev/backend-dev thuc te thuoc
      # CHUNG 1 compose project voi stack default - ten project mac dinh la
      # basename thu muc ("scraper-linkedin"), khong phai "seeding-dev". Neu ep
      # '-p seeding-dev', "up -d" se dung ten container (seeding-frontend-dev/
      # seeding-backend-dev) giong het container that dang mang project-label
      # "scraper-linkedin" -> Docker tu choi tao container trung ten -> lenh loi
      # nhung bi '|| true' nuot -> deploy bao xanh nhung dev.seeding.markeeai.com
      # van chay code cu (da xay ra 2 lan: 2026-08-04 va 2026-08-29). Luon de
      # compose tu suy ra ten project (khong '-p') de khop dung label hien co.
      - name: Chan doan + rebuild stack dev (domain)
        run: |
          echo "===== docker compose ls ====="; docker compose ls || true
          echo "===== docker ps ====="; docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}' || true
          echo "===== compose files ====="; ls -la docker-compose*.yml || true
          echo "===== router server_name -> upstream ====="
          docker exec seeding-router sh -c 'cat /etc/nginx/nginx.conf /etc/nginx/conf.d/*.conf 2>/dev/null' | grep -iE "server_name|proxy_pass|upstream|dev\.seeding" | head -60 || true
          echo "===== rebuild container -dev neu co ====="
          if [ -f docker-compose.dev.yml ]; then
            docker compose -f docker-compose.dev.yml build || true
            docker compose -f docker-compose.dev.yml up -d || true
            docker exec seeding-router nginx -s reload 2>/dev/null || docker compose restart router || true
            echo "da rebuild + up -d frontend-dev/backend-dev"
          else
            echo "KHONG thay docker-compose.dev.yml o thu muc deploy - domain co the route noi khac"
          fi

      # Cung 1 loai su co da gap tren host APP production (2026-09-21): docker
      # build cache tich luy toi 23.5GB khong ai prune -> / day 100% -> deploy
      # fail vi khong ghi noi log. Don cache cu (>24h) sau moi lan deploy thanh
      # cong de tranh lap lai, van giu cache gan day de build nhanh.
      - name: Don dep Docker build cache cu
        if: success()
        run: |
          docker builder prune -af --filter until=24h || true
          df -h / | tail -1
