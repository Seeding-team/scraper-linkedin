name: Deploy Dev

# Auto-deploy khi push/merge len dev (chay tren self-hosted runner tren host
# DEV). Nhan nut "Run workflow" neu muon deploy mot nhanh/commit cu the.
# KHONG dung actions/checkout vi day la "pull + rebuild" tren may that,
# khong phai build tu checkout moi.
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhanh/commit muon deploy (de trong = dung dev moi nhat)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: [self-hosted, dev]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull code theo ref duoc chon
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          echo "===== Sync code on DEV host ====="
          # Giải phóng lock trên các file bind-mount (nginx-router/nginx.conf)
          docker rm -f seeding-router 2>/dev/null || true
          rm -f .git/index.lock || true
          rm -rf nginx-router/nginx.conf
          git fetch origin "$REF"
          git checkout -f -B "$REF" "origin/$REF" || git checkout -f "$REF" || true
          git reset --hard "origin/$REF"
          rm -rf nginx-router/nginx.conf
          git show "origin/$REF:nginx-router/nginx.conf" > nginx-router/nginx.conf
          git clean -fd -e ".env*" -e "docker-compose*.yml"
          ls -l nginx-router/nginx.conf
          echo "===== Current commit on host ====="
          git log -n 1 --oneline

      # Xem giai thich chi tiet trong deploy-app.yml: build frontend chi thay
      # context ./linkedin-crawler-ui nen khong tu build lai duoc zip tu
      # ../extensions/ ben trong Docker -> phai dong goi rieng tren host truoc.
      - name: Dong goi lai extension zip tu source moi nhat
        run: |
          rm -rf linkedin-crawler-ui/node_modules || true
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo/linkedin-crawler-ui \
            node:20-alpine \
            sh -c "npm install --no-package-lock --no-save --no-audit archiver@^8.0.0 && npm run build:extensions && rm -rf node_modules" || true

      - name: Build frontend + backend
        run: docker compose build frontend backend

      - name: Dong bo database tu Main sang Dev
        run: |
          echo "===== 1. Syncing database from Main (10.30.194.82) to Dev (10.30.195.32) ====="
          docker run --rm postgres:alpine sh -c "
            set -e
            echo 'Testing connection to Dev DB...'
            psql 'postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres' -c 'SELECT 1;'
            
            echo 'Running pg_dump from Main and restoring to Dev...'
            pg_dump --clean --if-exists --no-owner --no-privileges --schema=public \
              'postgresql://postgres.seeding:9Esqznvy_NTKeAFZDwrGh4FICe6Gr08XYBwA5kHzxuY@10.30.194.82:5432/postgres' \
              | psql 'postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres' || true
              
            echo 'Verifying synced public table count on DEV:'
            psql 'postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres' -c \"SELECT count(*) as total_tables FROM information_schema.tables WHERE table_schema = 'public';\"
          "

      - name: Ap dung migration database 221
        run: |
          echo "===== 2. Applying migration 221 to Dev DB (10.30.195.32) ====="
          docker run --rm -v "$PWD:/repo" postgres:alpine sh -c "psql 'postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres' -f /repo/linkedin_group_crawler/supabase/migrations/221_facebook_messenger_api.sql || true"

      - name: Cap nhat bien moi truong host DEV sang DB moi
        run: |
          echo "===== 3. Updating host .env to use new Dev Supabase ====="
          if [ -f linkedin_group_crawler/.env ]; then
            sed -i 's|^SUPABASE_URL=.*|SUPABASE_URL=https://seeding-dev-test.db.markeeai.com|' linkedin_group_crawler/.env || true
            sed -i 's|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTQxMzM2OTMsImV4cCI6MjEwOTQ5MzY5M30.CThsrGk6Vic2YIN46XJcryvPF4BvLN0mN7HyYuG6oqQ|' linkedin_group_crawler/.env || true
            sed -i 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres|' linkedin_group_crawler/.env || true
            sed -i 's|^DIRECT_DATABASE_URL=.*|DIRECT_DATABASE_URL=postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres|' linkedin_group_crawler/.env || true
          fi

      - name: Ap dung container moi
        run: |
          if [ -d nginx-router/nginx.conf ] || [ ! -f nginx-router/nginx.conf ]; then
            rm -rf nginx-router/nginx.conf
            git show HEAD:nginx-router/nginx.conf > nginx-router/nginx.conf
          fi
          docker compose up -d frontend backend router
          sleep 5
          docker image prune -f

      - name: Kiem tra healthcheck
        run: |
          sleep 3
          curl -sf -o /dev/null http://localhost:8080/ || (echo "Frontend khong phan hoi" && exit 1)
          curl -sf -o /dev/null http://localhost:8080/api/all-platform/auth/me || echo "Luu y: auth/me khong phai 200 (co the do chua dang nhap, khong tinh la loi)"

      # dev.seeding.markeeai.com duoc phuc vu boi 2 container rieng (frontend-dev/
      # backend-dev, docker-compose.dev.yml).
      - name: Chan doan + rebuild stack dev (domain)
        run: |
          echo "===== docker ps ====="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          echo "===== rebuild stack dev.seeding.markeeai.com ====="
          if [ -f docker-compose.dev.yml ]; then
            echo "Building docker-compose.dev.yml..."
            docker compose -f docker-compose.dev.yml build || docker compose -f docker-compose.yml -f docker-compose.dev.yml build frontend-dev backend-dev || true
            echo "Recreating dev containers..."
            docker volume create scraper-linkedin_backend-storage 2>/dev/null || true
            docker rm -f seeding-frontend-dev seeding-backend-dev 2>/dev/null || true
            docker compose -f docker-compose.dev.yml up -d --force-recreate
            sleep 5
            docker ps --filter "name=seeding-.*-dev"
            echo "da rebuild + up -d --force-recreate frontend-dev/backend-dev"
          else
            echo "KHONG thay docker-compose.dev.yml o thu muc deploy - domain co the route noi khac"
            exit 1
          fi

      # Cung 1 loai su co da gap tren host APP production (2026-09-21): docker
      # build cache tich luy toi 23.5GB khong ai prune -> / day 100% -> deploy
      # fail vi khong ghi noi log. Don cache cu (>24h) sau moi lan deploy thanh
      # cong de tranh lap lai, van giu cache gan day de build nhanh.
      - name: Don dep Docker build cache cu
        if: success()
        run: |
          docker builder prune -af --filter until=24h || true
          df -h / | tail -1
