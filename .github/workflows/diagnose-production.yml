name: Diagnose Production Host

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: 1. RAM and System Resources
        run: |
          echo "=== 1. RAM USAGE (free -m) ==="
          free -m
          echo "=== 2. UPTIME & LOAD AVERAGE ==="
          uptime
          echo "=== 3. DISK SPACE (df -h) ==="
          df -h /

      - name: 2. Docker Containers Status
        run: |
          echo "=== DOCKER CONTAINERS STATUS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"

      - name: 3. Backend VoIP & Call Logs (Read-Only)
        run: |
          echo "=== ZALO VOIP / ZRTC / CALL LOGS (LAST 5000 LINES) ==="
          docker logs --tail 5000 seeding-backend 2>&1 | grep -iE "CALL-START|ZRTC|VOIP|1130|answer|cancel|zcall|OPUS|NAT-KEEPALIVE|call-ws|call/start|call_session" | tail -n 200 || true
          echo "=== LAST 80 LINES OF ROUTER LOGS (CALL/WS) ==="
          docker logs --tail 2000 seeding-router 2>&1 | grep -iE "call|ws" | tail -n 80 || true

      - name: 4. Read-Only Runtime Check (PyAV Opus, UDP/STUN NAT, Listener)
        run: |
          docker exec -i seeding-backend python -c '
          import asyncio, socket, struct, os
          print("=== GIT / CODE CHECK ===")
          import inspect
          from app.modules.all_platform.zalo.services import zalo_call_service as zcs
          print("OPUS_PAYLOAD_TYPE:", zcs.OPUS_PAYLOAD_TYPE)
          print("Has _ZaloOpusCodec:", hasattr(zcs, "_ZaloOpusCodec"))
          print("_av imported:", zcs._av is not None, getattr(zcs._av, "__version__", None))
          codec = zcs._ZaloOpusCodec()
          enc = codec.encode_pcm16_frame(b"\x00" * 640)
          dec = codec.decode_opus_to_pcm16(enc)
          print("Opus roundtrip OK:", len(enc), "bytes -> decoded", len(dec), "bytes")

          print("=== UDP / STUN NAT CHECK (NO ZALO CALLS) ===")
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(2.0)
          s.bind(("0.0.0.0", 0))
          local_port = s.getsockname()[1]
          print("Local bound port:", local_port)
          for host, port in [("stun.l.google.com", 19302), ("stun1.l.google.com", 19302)]:
              try:
                  ip = socket.gethostbyname(host)
                  req, tx = zcs._build_stun_binding_request()
                  s.sendto(req, (ip, port))
                  data, addr = s.recvfrom(2048)
                  res = zcs._parse_stun_binding_response(data, tx)
                  print(f"STUN {host}:{port} ({ip}) -> {res}")
              except Exception as e:
                  print(f"STUN {host}:{port} ERROR -> {e}")
          s.close()

          print("=== CHECK ZCA PERSISTENT LISTENER & CALL SESSIONS ===")
          from app.modules.all_platform.zalo.services import zca_persistent_listener as zpl
          mgr = zpl._MANAGER
          print("Active listeners:", list(getattr(mgr, "_states", {}).keys()))
          for uid in list(getattr(mgr, "_states", {}).keys()):
              st = zpl.get_listener_status(uid)
              print("  listener", uid, st)
          print("Active call sessions in memory:", len(zcs._CALL_SESSIONS))
          for sid, sess in list(zcs._CALL_SESSIONS.items())[-10:]:
              print("  session", sid, "status=", sess.status, "call_id=", sess.call_id, "zrtc_token=", hex(sess.zrtc_token), "tx=", sess.packets_sent, "rx=", sess.packets_received, "warn=", sess.warning)
          ' || true
