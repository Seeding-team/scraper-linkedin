name: Diagnose Production Host

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: 1. RAM and System Resources
        run: |
          echo "=== 1. RAM USAGE (free -m) ==="
          free -m
          echo "=== 2. UPTIME & LOAD AVERAGE ==="
          uptime
          echo "=== 3. DISK SPACE (df -h) ==="
          df -h /

      - name: 2. Docker Containers Status
        run: |
          echo "=== DOCKER CONTAINERS STATUS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"

      - name: 3. Docker Resource Usage (RAM/CPU)
        run: |
          echo "=== DOCKER STATS (NO STREAM) ==="
          docker stats --no-stream

      - name: 4. Backend Container Logs
        run: |
          echo "=== ZALO VOIP & CALL LOGS IN LAST 1000 LINES ==="
          docker logs --tail 1000 seeding-backend 2>&1 | grep -i -C 3 -E "call|voice|1130|zcall|requestcall|start_call" || true
          echo "=== LAST 200 LINES OF BACKEND RAW LOGS ==="
          docker logs --tail 200 seeding-backend || true

      - name: 5. Router (Nginx) Logs
        run: |
          echo "=== LAST 50 LINES OF ROUTER LOGS ==="
          docker logs --tail 50 seeding-router || true

      - name: 6. Test Direct Call Signaling in Container
        run: |
          echo "=== TESTING DIRECT CALL SIGNALING MATRIX IN BACKEND CONTAINER ==="
          docker exec -i seeding-backend node -e '
          const fs = require("fs");
          const { Zalo } = require("zca-js");

          async function run() {
            // Load auth for zl_f2c46742
            const dbAuth = JSON.parse(fs.readFileSync("/tmp/zca_auth_zl_f2c46742.json", "utf8") || "{}");
            const zalo = new Zalo({
              cookie: dbAuth.cookies,
              imei: dbAuth.imei,
              userAgent: dbAuth.userAgent,
            });
            const api = await zalo.login();
            console.log("LOGIN_OK:", !!api);

            let exec;
            api.custom("__testExec", async ({ ctx, utils, props }) => {
              exec = async ({ endpointPath, paramsObj, method = "GET" }) => {
                const baseDomain = "https://voicecall-wpa.chat.zalo.me";
                const payloadWithImei = {
                  ...paramsObj,
                  ...(paramsObj && paramsObj.imei === undefined ? { imei: ctx.imei } : {}),
                };
                const encryptedParams = utils.encodeAES(JSON.stringify(payloadWithImei));
                if (method.toUpperCase() === "POST") {
                  const url = utils.makeURL(`${baseDomain}${endpointPath}`);
                  const res = await utils.request(url, {
                    method: "POST",
                    body: new URLSearchParams({ params: encryptedParams }),
                  });
                  return utils.resolve(res);
                } else {
                  const url = utils.makeURL(`${baseDomain}${endpointPath}`, { params: encryptedParams });
                  const res = await utils.request(url, { method: "GET" });
                  return utils.resolve(res);
                }
              };
            });
            await api.__testExec();

            const calleeId = "6363678867120121443";
            const callId = Math.floor(Date.now() / 1000);

            // Step 1: RequestCall
            console.log("--- RUNNING STEP 1 (requestcall) ---");
            const s1 = await exec({
              endpointPath: "/api/voicecall/requestcall",
              paramsObj: { calleeId, callId, codec: "[]", typeRequest: 1 },
              method: "GET",
            });
            console.log("STEP 1 SUCCESS:", JSON.stringify(s1));

            // Test Permutations for Step 2
            const variants = [
              { name: "V1_GET_original", endpoint: "/api/voicecall/request", method: "GET", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, codec: "[]", session: s1.id || callId, callId: s1.id || callId } },
              { name: "V2_POST_original", endpoint: "/api/voicecall/request", method: "POST", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, codec: "[]", session: s1.id || callId, callId: s1.id || callId } },
              { name: "V3_GET_sessId_string", endpoint: "/api/voicecall/request", method: "GET", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, codec: "[]", session: s1.sessId, callId: s1.id || callId } },
              { name: "V4_POST_sessId_string", endpoint: "/api/voicecall/request", method: "POST", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, codec: "[]", session: s1.sessId, callId: s1.id || callId } },
              { name: "V5_GET_sessId_param", endpoint: "/api/voicecall/request", method: "GET", params: { calleeId, toId: s1.toId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, sessId: s1.sessId, session: s1.sessId, callId: s1.id || callId } },
              { name: "V6_POST_sessId_param", endpoint: "/api/voicecall/request", method: "POST", params: { calleeId, toId: s1.toId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, sessId: s1.sessId, session: s1.sessId, callId: s1.id || callId } },
              { name: "V7_GET_subCommand_extendData", endpoint: "/api/voicecall/request", method: "GET", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, session: s1.id || callId, callId: s1.id || callId, subCommand: 3, extendData: s1.sessId || "" } },
              { name: "V8_POST_subCommand_extendData", endpoint: "/api/voicecall/request", method: "POST", params: { calleeId, rtcpAddress: s1.rtcpIP || s1.rtpIP, rtpAddress: s1.rtpIP, session: s1.id || callId, callId: s1.id || callId, subCommand: 3, extendData: s1.sessId || "" } },
              { name: "V9_GET_merged_all", endpoint: "/api/voicecall/request", method: "GET", params: { calleeId, toId: s1.toId, fromId: s1.fromId, rtcpAddress: s1.rtcpIP, rtpAddress: s1.rtpIP, rtcpIP: s1.rtcpIP, rtpIP: s1.rtpIP, session: s1.id || callId, sessId: s1.sessId, callId: s1.id || callId, id: s1.id || callId, codec: "[]" } },
              { name: "V10_POST_merged_all", endpoint: "/api/voicecall/request", method: "POST", params: { calleeId, toId: s1.toId, fromId: s1.fromId, rtcpAddress: s1.rtcpIP, rtpAddress: s1.rtpIP, rtcpIP: s1.rtcpIP, rtpIP: s1.rtpIP, session: s1.id || callId, sessId: s1.sessId, callId: s1.id || callId, id: s1.id || callId, codec: "[]" } },
            ];

            for (const v of variants) {
              try {
                const res = await exec({ endpointPath: v.endpoint, paramsObj: v.params, method: v.method });
                console.log(`[PASS] ${v.name}:`, JSON.stringify(res));
              } catch (err) {
                console.log(`[FAIL] ${v.name}:`, err.message || err);
              }
            }
          }

          run().catch(e => console.error("NODE_TEST_ERR:", e));
          ' || true
