name: Diagnose Production Host

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: 1. RAM and System Resources
        run: |
          echo "=== 1. RAM USAGE (free -m) ==="
          free -m
          echo "=== 2. UPTIME & LOAD AVERAGE ==="
          uptime
          echo "=== 3. DISK SPACE (df -h) ==="
          df -h /

      - name: 2. Docker Containers Status
        run: |
          echo "=== DOCKER CONTAINERS STATUS ==="
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"

      - name: 3. Docker Resource Usage (RAM/CPU)
        run: |
          echo "=== DOCKER STATS (NO STREAM) ==="
          docker stats --no-stream

      - name: 4. Backend Container Logs
        run: |
          echo "=== ZALO VOIP & CALL LOGS IN LAST 1000 LINES ==="
          docker logs --tail 1000 seeding-backend 2>&1 | grep -i -C 3 -E "call|voice|1130|zcall|requestcall|start_call" || true
          echo "=== LAST 200 LINES OF BACKEND RAW LOGS ==="
          docker logs --tail 200 seeding-backend || true

      - name: 5. Router (Nginx) Logs
        run: |
          echo "=== LAST 50 LINES OF ROUTER LOGS ==="
          docker logs --tail 50 seeding-router || true

      - name: 6. Test Direct Call Signaling Matrix in Container
        run: |
          echo "=== EXPORTING ZCA AUTH TO /tmp/test_auth.json INSIDE CONTAINER ==="
          docker exec -i seeding-backend python -c '
          import asyncio, json
          from app.modules.all_platform.zalo.services.zca_auth_store import load_zca_auth

          async def export_auth():
              auth = await load_zca_auth("zl_f2c46742")
              if not auth:
                  print("ERROR: No auth for zl_f2c46742")
                  return
              with open("/tmp/test_auth.json", "w") as f:
                  json.dump(auth, f)
              print("AUTH EXPORTED OK!")

          asyncio.run(export_auth())
          '

          echo "=== RUNNING NODE.JS SIGNALING PERMUTATION MATRIX ==="
          docker exec -i seeding-backend node -e '
          const fs = require("fs");
          const { Zalo } = require("zca-js");

          function normalizeCookieJar(cookies) {
            if (!cookies) return null;
            let parsed = typeof cookies === "string" ? JSON.parse(cookies) : cookies;
            if (Array.isArray(parsed)) {
              return parsed.map(c => {
                let e = c.expires || c.expirationDate;
                if (typeof e === "number") c.expires = new Date(e * 1000).toISOString();
                return c;
              });
            }
            if (parsed && Array.isArray(parsed.cookies)) {
              parsed.cookies = parsed.cookies.map(c => {
                let e = c.expires || c.expirationDate;
                if (typeof e === "number") c.expires = new Date(e * 1000).toISOString();
                return c;
              });
            }
            return parsed;
          }

          async function main() {
            const authRaw = fs.readFileSync("/tmp/test_auth.json", "utf-8");
            const auth = JSON.parse(authRaw);
            const cookie = normalizeCookieJar(auth.cookies);
            const zalo = new Zalo({ selfListen: false, checkUpdate: false, logging: false });
            const api = await zalo.login({ cookie, imei: auth.imei, userAgent: auth.userAgent });
            console.log("ZALO LOGIN OK!");

            let exec;
            api.custom("__diagExec", async ({ ctx, utils, props }) => {
              exec = async ({ endpointPath, paramsObj, method = "GET" }) => {
                const baseDomain = "https://voicecall-wpa.chat.zalo.me";
                const payloadWithImei = {
                  ...paramsObj,
                  ...(paramsObj && paramsObj.imei === undefined ? { imei: ctx.imei } : {}),
                };
                const encryptedParams = utils.encodeAES(JSON.stringify(payloadWithImei));
                if (!encryptedParams) throw new Error("Failed to encodeAES");
                if (method.toUpperCase() === "POST") {
                  const url = utils.makeURL(`${baseDomain}${endpointPath}`);
                  const res = await utils.request(url, {
                    method: "POST",
                    body: new URLSearchParams({ params: encryptedParams }),
                  });
                  return utils.resolve(res);
                } else {
                  const url = utils.makeURL(`${baseDomain}${endpointPath}`, { params: encryptedParams });
                  const res = await utils.request(url, { method: "GET" });
                  return utils.resolve(res);
                }
              };
            });
            await api.__diagExec();

            const calleeId = "6363678867120121443";
            const callId = Math.floor(Date.now() / 1000);

            console.log("--- EXECUTING STEP 1: 11300 requestcall ---");
            const s1 = await exec({
              endpointPath: "/api/voicecall/requestcall",
              paramsObj: { calleeId, callId, codec: "[]", typeRequest: 1 },
              method: "GET"
            });
            console.log("STEP 1 RESULT:", JSON.stringify(s1));

            const toIdStr = String(s1.toId || "");
            const rtp = s1.rtpIP || "171.244.25.121:4200";
            const rtcp = s1.rtcpIP || rtp;
            const effCallId = Number(s1.id || callId);

            const variants = [
              // 1. GET vs POST with basic parameters
              { name: "T01_GET_basic_uid", method: "GET", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },
              { name: "T02_POST_basic_uid", method: "POST", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },
              { name: "T03_GET_basic_toId", method: "GET", params: { calleeId: toIdStr, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },
              { name: "T04_POST_basic_toId", method: "POST", params: { calleeId: toIdStr, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },

              // 2. With extendData and subCommand 3
              { name: "T05_GET_extendData_uid", method: "GET", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },
              { name: "T06_POST_extendData_uid", method: "POST", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },
              { name: "T07_GET_extendData_toId", method: "GET", params: { calleeId: toIdStr, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },
              { name: "T08_POST_extendData_toId", method: "POST", params: { calleeId: toIdStr, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },

              // 3. With both calleeId and toId
              { name: "T09_GET_both_ids", method: "GET", params: { calleeId, toId: s1.toId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },
              { name: "T10_POST_both_ids", method: "POST", params: { calleeId, toId: s1.toId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId, extendData: s1.sessId, subCommand: 3 } },

              // 4. Session variations (session as sessId string)
              { name: "T11_GET_sessId_as_session", method: "GET", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: s1.sessId, callId: effCallId } },
              { name: "T12_POST_sessId_as_session", method: "POST", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: s1.sessId, callId: effCallId } },

              // 5. Codec as full array object instead of string "[]"
              { name: "T13_GET_codec_array_obj", method: "GET", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: [{ id: 111, name: "opus", clockrate: 48000, channels: 1 }], session: effCallId, callId: effCallId } },
              { name: "T14_POST_codec_array_obj", method: "POST", params: { calleeId, rtcpAddress: rtcp, rtpAddress: rtp, codec: [{ id: 111, name: "opus", clockrate: 48000, channels: 1 }], session: effCallId, callId: effCallId } },

              // 6. With callType: 1
              { name: "T15_GET_callType1", method: "GET", params: { calleeId, callType: 1, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },
              { name: "T16_POST_callType1", method: "POST", params: { calleeId, callType: 1, rtcpAddress: rtcp, rtpAddress: rtp, codec: "[]", session: effCallId, callId: effCallId } },
            ];

            console.log("--- TESTING 16 PERMUTATIONS FOR 11301 /api/voicecall/request ---");
            for (const v of variants) {
              try {
                const res = await exec({
                  endpointPath: "/api/voicecall/request",
                  paramsObj: v.params,
                  method: v.method
                });
                console.log(`>>> [PASS] ${v.name}:`, JSON.stringify(res));
              } catch (err) {
                console.log(`--- [FAIL] ${v.name}:`, err.message || JSON.stringify(err));
              }
            }
          }

          main().catch(e => console.error("FATAL_MAIN_ERR:", e));
          ' || true
