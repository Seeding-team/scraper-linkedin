name: Deploy CRM Markee

on:
  push:
    branches: [main]
    paths:
      - "crm-module/**"
      - ".github/workflows/deploy-crm-module.yml"
  workflow_dispatch:

concurrency:
  group: deploy-crm-markee-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      # Host app (10.120.60.26) dung CHUNG cho 3 stack CRM + app: moi lan build backend ~2.35GB
      # va docker build cache tich luy khong ai don -> / day 100% (21/09: 23.5GB, 10/10: 18.8GB),
      # runner khong ghi noi log -> job chet o buoc dau "No space left on device" du code khong loi.
      # Buoc nay chay DAU job: neu dia trong < 8GB thi don truoc khi build.
      - name: Dam bao dia con trong
        working-directory: /
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Dia con trong: ${avail}GB"
          if [ "${avail:-0}" -lt 8 ]; then
            echo "Dia sap day -> don Docker build cache + image mo coi"
            docker builder prune -af || true
            docker image prune -f || true
            df -h / | tail -1
          fi

      - name: Pull main
        # Repo tren host nay dung CHUNG working-directory voi deploy-app.yml
        # (/opt/apps/seeding_markeeai/scraper-linkedin). Buoc dong goi extension
        # zip trong deploy-app.yml de lai linkedin-crawler-ui/public/*.zip
        # "dirty" (sua tay, chua commit) sau moi lan deploy App -> lan deploy
        # CRM ke tiep bi `git pull --ff-only` tu choi vi file dang bi sua tay.
        # Fix giong deploy-app.yml: xoa rac build artifact truoc khi pull (an
        # toan, deploy-app.yml se tu build lai tu source o lan sau).
        run: |
          git checkout -- linkedin-crawler-ui/public/*.zip || true
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Sync CRM source while preserving runtime secrets
        run: |
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            crm-module/ /opt/apps/crm-module/

      - name: Build and apply CRM containers
        working-directory: /opt/apps/crm-module
        run: |
          docker compose -p crm-markee build frontend backend
          docker compose -p crm-markee up -d frontend backend
          docker compose -p crm-markee restart router

      - name: Verify CRM production
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:18090/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 120 crm-module-frontend
          docker logs --tail 120 crm-module-backend
          exit 1

      # Don build cache cu (>24h) SAU MOI lan deploy, ke ca khi deploy loi (if: always()) - truoc
      # day chi co deploy-app.yml va chi khi thanh cong, trong khi 3 workflow CRM (chay moi lan
      # push) khong don gi. Van giu cache 24h gan nhat de build nhanh.
      - name: Don dep Docker build cache cu
        if: always()
        working-directory: /
        run: |
          docker builder prune -af --filter until=24h || true
          df -h / | tail -1
