name: Deploy CRM Markee

on:
  push:
    branches: [main]
    paths:
      - "crm-module/**"
      - ".github/workflows/deploy-crm-module.yml"
  workflow_dispatch:

concurrency:
  group: deploy-crm-markee-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Sync CRM source while preserving runtime secrets
        run: |
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            crm-module/ /opt/apps/crm-module/

      - name: Build and apply CRM containers
        working-directory: /opt/apps/crm-module
        run: |
          docker compose -p crm-markee build frontend backend
          docker compose -p crm-markee up -d frontend backend
          docker compose -p crm-markee restart router

      - name: Verify CRM production
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:18090/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 120 crm-module-frontend
          docker logs --tail 120 crm-module-backend
          exit 1
