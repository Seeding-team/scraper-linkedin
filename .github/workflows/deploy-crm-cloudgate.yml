name: Deploy CRM Cloudgate

on:
  push:
    branches: [main]
    paths:
      - "crm-cloudgate/**"
      - ".github/workflows/deploy-crm-cloudgate.yml"
  workflow_dispatch:

concurrency:
  group: deploy-crm-shared-checkout
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, app]
    defaults:
      run:
        working-directory: /opt/apps/seeding_markeeai/scraper-linkedin
    steps:
      - name: Pull main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Sync CRM source while preserving runtime secrets
        run: |
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            crm-cloudgate/ /opt/apps/crm-cloudgate/

      - name: Build and apply CRM containers
        working-directory: /opt/apps/crm-cloudgate
        run: |
          docker compose build frontend backend
          docker compose up -d frontend backend
          docker compose restart router

      - name: Verify CRM production
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:18091/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 120 crm-cloudgate-frontend
          docker logs --tail 120 crm-cloudgate-backend
          exit 1
