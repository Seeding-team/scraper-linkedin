worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    # Conditional WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the browser-facing HTTPS host when OnlyOffice is served below a
    # virtual path. Document Server uses these headers to generate iframe,
    # asset, and WebSocket URLs beneath /onlyoffice-ds/.
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip off;

    server {
        listen 8080;

        # SSE endpoints — NO buffering, NO gzip, long timeout
        location ~ ^/api/all-platform/zalo/(events|jobs/events|auth/events) {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # All other /api/all-platform/zalo/ routes
        location /api/all-platform/zalo/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        # WebSocket: crawl-status (dedicated location for proper keepalive)
        location /api/all-platform/ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # General /api/ routes
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 50M;
            gzip off;
        }

        # WebSocket routes
        location /ws/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # OnlyOffice Document Server. Keep it on the same HTTPS origin as the
        # CRM so browsers never attempt to load an insecure localhost URL.
        location /onlyoffice-ds/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $onlyoffice_upstream "http://onlyoffice:80";
            # rewrite ... break + proxy_pass bien KHONG co URI: cat tien to /onlyoffice-ds/ dung. (Truoc day "proxy_pass $bien/;" khien
            # nginx gui MOI request len "/" -> /onlyoffice-ds/<phien-ban>/... deu thanh "/" -> Word Editor khong the chay.)
            rewrite ^/onlyoffice-ds/(.*)$ /$1 break;
            proxy_pass $onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $forwarded_host/onlyoffice-ds;
            # Public CRM endpoints are HTTPS-only. The upstream load balancer
            # reaches this router over HTTP, so forwarding its scheme would
            # make OnlyOffice generate blocked http:// cache/download URLs.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            # Chrome chan "unload" mac dinh; ma OnlyOffice van dang ky unload -> canh bao console. Cho phep rieng Document Server (cung origin).
            add_header Permissions-Policy "unload=(self)" always;
            client_max_body_size 100M;
        }

        # Frontend static
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
