worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    server {
        listen 8080;

        # SSE (Zalo realtime, đồng bộ từ crm-module 2026-09-23) - KHÔNG buffering,
        # timeout dài. Phải đặt TRƯỚC location /api/ ở dưới.
        location ~ ^/api/all-platform/zalo/events {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # OnlyOffice Document Server (Word Editor, 2026-10-27): ĐÃ THỬ proxy qua cùng origin với
        # frontend ở đây (location /onlyoffice-ds/) để dispatch Ctrl+S thật từ code FE vào
        # iframe.contentDocument (bị chặn vì khác origin với localhost:8098 trực tiếp). Proxy tuy
        # chạy được (DOM access + websocket đều OK, đã verify) nhưng sau đó dispatch Ctrl+S KHÔNG
        # còn kích hoạt lưu thật qua nó (đã loại trừ stale lock bằng restart sạch container OnlyOffice,
        # vẫn không lại được) - ĐÃ REVERT, quay về gọi trực tiếp localhost:8098 như ban đầu. Xem
        # báo cáo QA Word Editor (2026-10-27) + ghi chú trong contract_edit_service.py/
        # ContractAiReviewPanel.tsx trước khi thử lại hướng này.

        # CRM backend (FastAPI) + Zalo (request/response thường, trừ SSE ở trên)
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Production Word Editor: expose Document Server beneath the existing
        # CRM HTTPS origin and preserve the virtual path in generated URLs.
        location /onlyoffice-ds/ {
            # Phan giai ten "onlyoffice" luc co request (khong phai luc khoi dong): router van chay duoc khi ban CRM nay
            # chua co container OnlyOffice (truoc day nginx chet "host not found in upstream" -> cong 1809x sap).
            # rewrite ... break + proxy_pass bien (khong URI) = cat tien to /onlyoffice-ds/ dung nhu proxy_pass .../ truoc day.
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $onlyoffice_upstream "http://onlyoffice:80";
            rewrite ^/onlyoffice-ds/(.*)$ /$1 break;
            proxy_pass $onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $forwarded_host/onlyoffice-ds;
            # TLS terminates before this router; force the browser-facing
            # scheme so OnlyOffice never generates mixed-content URLs.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            # Chrome dang chan su kien "unload" mac dinh; ma cua OnlyOffice (Main.js/plugins.js) van dang ky unload
            # -> console bao "[Violation] Permissions policy violation: unload is not allowed". Cho phep rieng cho Document Server (cung origin).
            add_header Permissions-Policy "unload=(self)" always;
            client_max_body_size 100M;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
