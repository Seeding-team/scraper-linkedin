services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: ${CRM_PUBLIC_URL:-http://localhost:18093}
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: ${NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_CRM_INSTANCE: timetech
    image: crm-timetech-frontend:latest
    container_name: crm-timetech-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "3000"
    networks:
      crm-net:
        aliases: [frontend]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crm-timetech-backend:latest
    container_name: crm-timetech-backend
    restart: unless-stopped
    init: true   # PID 1 reap tien trinh con (LibreOffice soffice.bin thanh zombie sau timeout)
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8000"
    volumes:
      - backend-artifacts:/app/artifacts
    networks:
      crm-net:
        aliases: [backend]

  # Word Editor trong AI Contract Review (2026-10-27, Phase POC PASS 6/6) - CHI DEV, KHONG
  # deploy production. ALLOW_PRIVATE_IP_ADDRESS/ALLOW_META_IP_ADDRESS bat buoc (xac nhan qua
  # POC that) de OnlyOffice tai duoc file nhap/callback toi backend noi bo (IP rieng tu).
  # JWT_ENABLED=true + JWT_SECRET dung chung voi ONLYOFFICE_JWT_SECRET trong backend/.env.
  onlyoffice:
    build:
      context: ./onlyoffice
      dockerfile: Dockerfile
    image: crm-timetech-onlyoffice:latest
    container_name: crm-timetech-onlyoffice
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    ports:
      - "${ONLYOFFICE_PORT:-8098}:80"
    volumes:
      - ./onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro
    networks:
      crm-net:
        aliases: [onlyoffice]

  router:
    image: nginx:alpine
    container_name: crm-timetech-router
    restart: unless-stopped
    depends_on: [frontend, backend]
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${CRM_ROUTER_PORT:-18093}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      crm-net:
        aliases: [router]

networks:
  crm-net:

volumes:
  backend-artifacts:
