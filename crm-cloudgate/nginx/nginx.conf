worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    server {
        listen 8080;

        # SSE (Zalo realtime, đồng bộ từ crm-module 2026-09-23) - KHÔNG buffering,
        # timeout dài. Phải đặt TRƯỚC location /api/ ở dưới.
        location ~ ^/api/all-platform/zalo/events {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # OnlyOffice Document Server (Word Editor, 2026-10-27): DA THU proxy qua cung origin voi
        # frontend o day (location /onlyoffice-ds/) de dispatch Ctrl+S that tu code FE vao
        # iframe.contentDocument (bi chan vi khac origin voi localhost:8095 truc tiep). Proxy TUY
        # chay duoc (DOM access + websocket deu OK, da verify) nhung sau do dispatch Ctrl+S KHONG
        # con kich hoat luu that qua no (da loai tru stale lock bang restart sach container OnlyOffice,
        # van khong lai duoc) - DA REVERT, quay ve goi truc tiep localhost:8095 nhu ban dau. Xem
        # bao cao QA Word Editor (2026-10-27) + ghi chu trong contract_edit_service.py/
        # ContractAiReviewPanel.tsx truoc khi thu lai huong nay.

        # CRM backend (FastAPI) + Zalo (request/response thuong, tru SSE o tren)
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Production Word Editor: expose Document Server beneath the existing
        # CRM HTTPS origin and preserve the virtual path in generated URLs.
        location /onlyoffice-ds/ {
            proxy_pass http://onlyoffice/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $forwarded_host/onlyoffice-ds;
            # TLS terminates before this router; force the browser-facing
            # scheme so OnlyOffice never generates mixed-content URLs.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            # Chrome dang chan su kien "unload" mac dinh; ma cua OnlyOffice (Main.js/plugins.js) van dang ky unload
            # -> console bao "[Violation] Permissions policy violation: unload is not allowed". Cho phep rieng cho Document Server (cung origin).
            add_header Permissions-Policy "unload=(self)" always;
            client_max_body_size 100M;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
