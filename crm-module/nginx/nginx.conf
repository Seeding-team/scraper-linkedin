worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    server {
        listen 8080;

        # SSE (Zalo realtime, them 2026-09-23 khi gop module Zalo Chat/Inbox Zalo
        # Admin) - KHONG buffering, timeout dai, giong nguyen nginx.conf cua
        # zalo-module. Phai dat TRUOC location /api/ o duoi (khong bat buoc ve mat
        # ky thuat vi day la regex location, nhung de ro rang).
        location ~ ^/api/all-platform/zalo/events {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # CRM backend (FastAPI) + Zalo (request/response thuong, tru SSE o tren)
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
