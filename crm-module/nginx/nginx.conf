worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    server {
        listen 8080;

        # SSE (Zalo realtime, them 2026-09-23 khi gop module Zalo Chat/Inbox Zalo
        # Admin) - KHONG buffering, timeout dai, giong nguyen nginx.conf cua
        # zalo-module. Phai dat TRUOC location /api/ o duoi (khong bat buoc ve mat
        # ky thuat vi day la regex location, nhung de ro rang).
        location ~ ^/api/all-platform/zalo/events {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
        }

        # OnlyOffice Document Server (Word Editor, 2026-10-27): DA THU proxy qua cung origin voi
        # frontend o day (location /onlyoffice-ds/) de dispatch Ctrl+S that tu code FE vao
        # iframe.contentDocument (bi chan vi khac origin voi localhost:8095 truc tiep). Proxy TUY
        # chay duoc (DOM access + websocket deu OK, da verify) nhung sau do dispatch Ctrl+S KHONG
        # con kich hoat luu that qua no (da loai tru stale lock bang restart sach container OnlyOffice,
        # van khong lai duoc) - DA REVERT, quay ve goi truc tiep localhost:8095 nhu ban dau. Xem
        # bao cao QA Word Editor (2026-10-27) + ghi chu trong contract_edit_service.py/
        # ContractAiReviewPanel.tsx truoc khi thu lai huong nay.

        # CRM backend (FastAPI) + Zalo (request/response thuong, tru SSE o tren)
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
