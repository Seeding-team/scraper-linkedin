worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;

    # Server goc (giu nguyen production behavior - Host header that cua client)
    server {
        listen 8080;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # CHI DUNG LOCAL TEST: gia lap domain that bang cach ep cung Host header,
    # khong can sua file hosts / khong dung domain that. Vao localhost:<port>
    # tuong ung se thay dung workspace cua domain do.
    server {
        listen 8081; # localhost:18081 -> markee
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.markee.vn";
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.markee.vn";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8082; # localhost:18082 -> cloudgate
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.getcloudgate.com";
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.getcloudgate.com";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8083; # localhost:18083 -> securityzone
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.securityzone.vn";
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host "crm.securityzone.vn";
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
