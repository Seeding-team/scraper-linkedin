services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: ${CRM_PUBLIC_URL:-http://localhost:18090}
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: ${NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: crm-module-frontend:latest
    container_name: crm-module-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "3000"
    networks:
      crm-net:
        aliases: [frontend]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crm-module-backend:latest
    container_name: crm-module-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8000"
    networks:
      crm-net:
        aliases: [backend]

  router:
    image: nginx:alpine
    container_name: crm-module-router
    restart: unless-stopped
    depends_on: [frontend, backend]
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${CRM_ROUTER_PORT:-18090}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      crm-net:
        aliases: [router]

networks:
  crm-net:
