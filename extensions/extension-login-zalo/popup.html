<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seeding Zalo Connector</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        color: #172033;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .badge {
        display: inline-block;
        margin: 0 0 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #fbe7ec;
        color: #ba244a;
        font-size: 11px;
        font-weight: 700;
      }
      p {
        margin: 0 0 10px;
        font-size: 13px;
        line-height: 1.45;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        background: #ba244a;
        color: white;
        cursor: pointer;
        font-weight: 700;
        padding: 9px 10px;
      }
    </style>
  </head>
  <body>
    <span class="badge">SEEDING</span>
    <h1>Seeding Zalo Connector</h1>
    <p>Dùng riêng cho app Seeding (seeding.markeeai.com). Giữ đăng nhập Zalo Web, sau đó vào trang "Tài khoản Zalo" trên Seeding để nhập cookie hoặc đồng bộ tin nhắn.</p>
    <button id="open-zalo">Mở Zalo Web</button>
    <script src="popup.js"></script>
  </body>
</html>
