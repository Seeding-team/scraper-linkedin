version: '3.3'
services:
  frontend:
    build:
      context: ./linkedin-crawler-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: https://seeding.markeeai.com/
        NEXT_PUBLIC_API_FACEBOOK_BASE_URL: https://seeding.markeeai.com/
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: secret_api_key
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 957838257147-3jf82as4b1i0g1js004bkrpa1lhpcvp3.apps.googleusercontent.com
    image: scraper-linkedin-frontend:latest
    container_name: seeding-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    env_file:
      - ./linkedin-crawler-ui/.env
    expose:
      - "3000"
    networks:
      seeding-net:
        aliases:
          - frontend

  backend:
    build:
      context: ./linkedin_group_crawler
      dockerfile: Dockerfile
    image: scraper-linkedin-backend:latest
    container_name: seeding-backend
    restart: unless-stopped
    env_file:
      - ./linkedin_group_crawler/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Ho_Chi_Minh
      CRM_INSTANCE: markee
      DISABLE_ZCA_LISTENERS: "0"
    expose:
      - "8000"
    volumes:
      - backend-storage:/app/storage
      - backend-data:/app/data
      - backend-artifacts:/app/artifacts
    networks:
      seeding-net:
        aliases:
          - backend

  router:
    image: nginx:alpine
    container_name: seeding-router
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-router/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      seeding-net:
        aliases:
          - router

volumes:
  backend-artifacts:
  backend-storage:
  backend-data:

networks:
  seeding-net:
