version: '3.3'

services:
  frontend-dev:
    build:
      context: ./linkedin-crawler-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_URL: https://dev.seeding.markeeai.com/
        NEXT_PUBLIC_API_FACEBOOK_BASE_URL: https://dev.seeding.markeeai.com/
        NEXT_PUBLIC_LINKEDIN_CRAWLER_API_KEY: secret_api_key
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 957838257147-3jf82as4b1i0g1js004bkrpa1lhpcvp3.apps.googleusercontent.com
        NEXT_PUBLIC_GMAIL_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GMAIL_OAUTH_CLIENT_ID:-}
    image: scraper-linkedin-frontend-dev:latest
    container_name: seeding-frontend-dev
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    env_file:
      - ./linkedin-crawler-ui/.env
    expose:
      - "3000"
    networks:
      seeding-net:
        aliases:
          - frontend-dev

  backend-dev:
    build:
      context: ./linkedin_group_crawler
      dockerfile: Dockerfile
    image: scraper-linkedin-backend-dev:latest
    container_name: seeding-backend-dev
    restart: unless-stopped
    init: true
    env_file:
      - ./linkedin_group_crawler/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Ho_Chi_Minh
      CRM_INSTANCE: markee
      CRM_PUBLIC_URL: https://dev.seeding.markeeai.com
      DISABLE_ZCA_LISTENERS: "1"
      DISABLE_SCHEDULER: "1"
      DISABLE_ALL_PLATFORM_CRAWL_24H: "1"
      DISABLE_TELEGRAM_LISTENERS: "1"
      DISABLE_ZALO_FORWARD_ENGINE: "1"
      DISABLE_ZALO_AUTOMATION_WORKER: "1"
      DISABLE_ZALO_PUSH_NOTIFIER: "1"
      DISABLE_ZALO_CHATWOOT_BRIDGE: "1"
      SUPABASE_URL: "https://seeding-dev-test.db.markeeai.com"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTQxMzM2OTMsImV4cCI6MjEwOTQ5MzY5M30.CThsrGk6Vic2YIN46XJcryvPF4BvLN0mN7HyYuG6oqQ"
      DATABASE_URL: "postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres"
      DIRECT_DATABASE_URL: "postgresql://postgres.seeding-dev-test:NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM@10.30.195.32:5462/postgres"
      SUPABASE_DB_PASSWORD: "NVaI8iX0cUvhQQ4dXnZ72B4WogfIokmvd6TpUHn80tM"
      SUPABASE_STUDIO_URL: "https://seeding-dev-test-studio.db.markeeai.com"
    expose:
      - "8000"
    volumes:
      - backend-storage:/app/storage
    networks:
      seeding-net:
        aliases:
          - backend-dev

networks:
  seeding-net:
    name: scraper-linkedin_seeding-net
    external: true

volumes:
  backend-storage:
    name: scraper-linkedin_backend-storage
    external: true
